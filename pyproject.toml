[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-circuit-simulator"
version = "0.1.0"
description = "A small educational toolkit for building, simulating, and analyzing quantum circuits with Qiskit."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yasmin Kasem" },
]
license = { text = "MIT" }

dependencies = [
    "qiskit>=1.0,<3.0",
    "qiskit-aer>=0.14,<1.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<10.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
